<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Network - Home Base</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="sovereign-fonts.css">
  <link rel="stylesheet" href="sovereign-chassis.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base-skin.css">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
</head>
<body data-nav-page="network">
  <div class="hb-shell">
    <main id="app" class="hb-main">
      <div class="hb-stack">
        <section class="hb-card">
          <div class="hb-skel hb-skel-title" style="width:34%;"></div>
          <div class="hb-skel hb-skel-line" style="margin-top:0.7rem;width:62%;"></div>
          <div class="hb-row" style="margin-top:0.75rem;gap:0.5rem;">
            <div class="hb-spinner"></div>
            <span class="hb-muted" id="hb-loading-msg" style="font-size:0.85rem;"></span>
          </div>
        </section>
        <section class="hb-card">
          <div class="hb-skel hb-skel-title" style="width:48%;margin-bottom:0.8rem;"></div>
          <div class="hb-skel hb-skel-line" style="width:100%;"></div>
          <div class="hb-skel hb-skel-line" style="margin-top:0.5rem;width:88%;"></div>
          <div class="hb-skel hb-skel-line" style="margin-top:0.5rem;width:75%;"></div>
        </section>
        <section class="hb-card">
          <div class="hb-skel hb-skel-title" style="width:42%;margin-bottom:0.8rem;"></div>
          <div class="hb-skel hb-skel-line" style="width:100%;"></div>
          <div class="hb-skel hb-skel-line" style="margin-top:0.5rem;width:82%;"></div>
          <div class="hb-skel hb-skel-line" style="margin-top:0.5rem;width:76%;"></div>
        </section>
      </div>
    </main>
  </div>
  <script src="/api.js"></script>
  <script src="/nav.js"></script>
  <script src="/settings.js"></script>

</html>
