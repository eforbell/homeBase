<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Home Base - Dashboard</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
</head>
<body data-nav-page="dashboard">
  <div class="hb-shell">
    <main id="app" class="hb-main">
      <div class="hb-stack">
        <section class="hb-card">
          <div class="hb-skel hb-skel-title" style="width:58%;"></div>
          <div class="hb-skel hb-skel-line" style="margin-top:0.7rem;width:72%;"></div>
          <div class="hb-row" style="margin-top:0.75rem;gap:0.5rem;">
            <div class="hb-spinner"></div>
            <span class="hb-muted" id="hb-loading-msg" style="font-size:0.85rem;"></span>
          </div>
        </section>
        <section class="hb-card">
          <div class="hb-skel hb-skel-title" style="width:44%;margin-bottom:0.7rem;"></div>
          <div class="hb-skel hb-skel-line" style="width:66%;"></div>
          <div class="hb-skel hb-skel-line" style="margin-top:0.45rem;width:55%;"></div>
        </section>
        <section class="hb-card">
          <div class="hb-skel hb-skel-title" style="width:38%;margin-bottom:0.7rem;"></div>
          <div class="hb-skel hb-skel-line" style="width:88%;"></div>
        </section>
        <section class="hb-card">
          <div class="hb-skel hb-skel-title" style="width:46%;margin-bottom:0.7rem;"></div>
          <div class="hb-skel hb-skel-line" style="width:60%;"></div>
          <div class="hb-skel hb-skel-line" style="margin-top:0.45rem;width:75%;"></div>
        </section>
        <section>
          <div class="hb-skel hb-skel-title" style="width:34%;margin-bottom:0.75rem;"></div>
          <div class="hb-grid hb-grid-2">
            <article class="hb-card">
              <div class="hb-skel hb-skel-line" style="width:55%;"></div>
              <div class="hb-skel hb-skel-line" style="margin-top:0.6rem;width:78%;"></div>
              <div class="hb-skel hb-skel-line" style="margin-top:0.3rem;width:65%;"></div>
            </article>
            <article class="hb-card">
              <div class="hb-skel hb-skel-line" style="width:50%;"></div>
              <div class="hb-skel hb-skel-line" style="margin-top:0.6rem;width:80%;"></div>
              <div class="hb-skel hb-skel-line" style="margin-top:0.3rem;width:70%;"></div>
            </article>
          </div>
        </section>
        <section class="hb-card">
          <div class="hb-skel hb-skel-title" style="width:36%;margin-bottom:0.7rem;"></div>
          <div class="hb-skel hb-skel-line" style="width:80%;"></div>
          <div class="hb-skel hb-skel-line" style="margin-top:0.45rem;width:70%;"></div>
          <div class="hb-skel hb-skel-line" style="margin-top:0.45rem;width:75%;"></div>
        </section>
      </div>
    </main>
  </div>
  <script src="/api.js"></script>
  <script src="/nav.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
